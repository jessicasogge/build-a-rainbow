<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Color Order: Build a Rainbow</title>
    <meta name="description" content="Tap the colors in rainbow order to build a rainbow, one stripe at a time. A free color game for kids." />
    <link rel="canonical" href="https://jessicasogge.github.io/build-a-rainbow/color-order.html" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="page level-page">
    <level-header number="2" name="Color order"></level-header>

    <main class="build">
      <!-- Red starts filled in. color-order-page.js fills in the rest, orange
           down to purple on the inside. -->
      <rainbow-stripes svg-class="build-rainbow" stripe-class="build-stripe" blank></rainbow-stripes>

      <helper-bubble>Red goes on top. Which color comes next?</helper-bubble>

      <!-- The color buttons, in a shuffled order. Added by color-order-page.js. -->
      <div class="tray"></div>

      <level-done heading="You built a rainbow!">
        Fun fact: a rainbow shows up when sunshine goes through raindrops.
      </level-done>
    </main>

    <footer class="signature">jsogge 2026</footer>

    <script type="module">
      import { start } from './game/color-order-page.js';
      start();
    </script>
  </body>
</html>
