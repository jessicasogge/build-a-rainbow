<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fix the Rainbow: Build a Rainbow</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="page level-page">
    <header class="page-header">
      <a class="round-button" href="./levels.html" aria-label="Back to the levels">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </a>
      <h1 class="level-title">Level 8 · Fix the rainbow</h1>
      <button type="button" class="round-button header-end" data-restart aria-label="Start over">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg>
      </button>
    </header>

    <main class="build">
      <!-- A rainbow with its stripes jumbled. fix-the-rainbow-page.js colors
           them; tap one stripe, then another, to swap them. -->
      <svg class="build-rainbow fix-rainbow" viewBox="0 0 640 340">
        <path class="fix-stripe" role="button" tabindex="0" aria-pressed="false" d="M20 330 A300 300 0 0 1 620 330 L584 330 A264 264 0 0 0 56 330 Z" fill="#ffffff" />
        <path class="fix-stripe" role="button" tabindex="0" aria-pressed="false" d="M56 330 A264 264 0 0 1 584 330 L548 330 A228 228 0 0 0 92 330 Z" fill="#ffffff" />
        <path class="fix-stripe" role="button" tabindex="0" aria-pressed="false" d="M92 330 A228 228 0 0 1 548 330 L512 330 A192 192 0 0 0 128 330 Z" fill="#ffffff" />
        <path class="fix-stripe" role="button" tabindex="0" aria-pressed="false" d="M128 330 A192 192 0 0 1 512 330 L476 330 A156 156 0 0 0 164 330 Z" fill="#ffffff" />
        <path class="fix-stripe" role="button" tabindex="0" aria-pressed="false" d="M164 330 A156 156 0 0 1 476 330 L440 330 A120 120 0 0 0 200 330 Z" fill="#ffffff" />
        <path class="fix-stripe" role="button" tabindex="0" aria-pressed="false" d="M200 330 A120 120 0 0 1 440 330 L404 330 A84 84 0 0 0 236 330 Z" fill="#ffffff" />
        <!-- The outline around the picked-up stripe, drawn on top so no neighbor hides it. -->
        <path class="fix-highlight" d="" hidden />
      </svg>

      <div class="helper">
        <span class="helper-face" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="10" r="1" /><circle cx="15" cy="10" r="1" /><path d="M8 14.5c1.2 1.6 2.4 2.2 4 2.2s2.8-.6 4-2.2" /></svg>
        </span>
        <p class="helper-text" aria-live="polite">Oh no, the colors are mixed up! Tap two stripes to swap them.</p>
      </div>

      <section class="level-done" hidden>
        <h2 tabindex="-1">You fixed the rainbow!</h2>
        <p class="fun-fact">Fun fact: rainbow colors always come in the same order, because sunlight bends a little differently for each color.</p>
        <div class="buttons">
          <button type="button" class="button button-levels" data-restart>Play again</button>
          <a class="button button-play" href="./levels.html">All levels</a>
        </div>
      </section>
    </main>

    <footer class="signature">jsogge 2026</footer>

    <script type="module">
      import { start } from './game/fix-the-rainbow-page.js';
      start();
    </script>
  </body>
</html>
