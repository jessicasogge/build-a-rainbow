<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fix the Rainbow: Build a Rainbow</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="page level-page">
    <level-header number="8" name="Fix the rainbow"></level-header>

    <main class="build">
      <!-- A rainbow with its stripes jumbled. fix-the-rainbow-page.js colors
           them; tap one stripe, then another, to swap them. -->
      <rainbow-stripes svg-class="build-rainbow fix-rainbow" stripe-class="fix-stripe" blank tappable highlight></rainbow-stripes>

      <helper-bubble>Oh no, the colors are mixed up! Tap two stripes to swap them.</helper-bubble>

      <level-done heading="You fixed the rainbow!" next="All levels">
        Fun fact: rainbow colors always come in the same order, because sunlight bends a little differently for each color.
      </level-done>
    </main>

    <footer class="signature">jsogge 2026</footer>

    <script type="module">
      import { start } from './game/fix-the-rainbow-page.js';
      start();
    </script>
  </body>
</html>
