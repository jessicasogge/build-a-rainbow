<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paint a Rainbow: Build a Rainbow</title>
    <meta name="description" content="Paint a rainbow in any colors you like. A free painting game for kids." />
    <link rel="canonical" href="https://jessicasogge.github.io/build-a-rainbow/paint-a-rainbow.html" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="page level-page">
    <level-header number="5" name="Paint a rainbow"></level-header>

    <main class="build">
      <!-- A blank rainbow. Each stripe is tappable; paint-a-rainbow-page.js
           paints it with whatever color is on the brush. -->
      <rainbow-stripes svg-class="build-rainbow paint-rainbow" stripe-class="paint-stripe" blank tappable></rainbow-stripes>

      <helper-bubble>Pick a color, then tap a stripe to paint it.</helper-bubble>

      <!-- The paints. Added by paint-a-rainbow-page.js. -->
      <div class="palette" role="group" aria-label="Paints"></div>

      <button type="button" class="button button-play" id="done" hidden>Done!</button>

      <level-done heading="What a beautiful rainbow!" again="Paint another">
        Fun fact: real rainbows always have their colors in the same order, but yours can be any colors you like.
      </level-done>
    </main>

    <footer class="signature">jsogge 2026</footer>

    <script type="module">
      import { start } from './game/paint-a-rainbow-page.js';
      start();
    </script>
  </body>
</html>
