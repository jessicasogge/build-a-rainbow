<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Rainbow: Build a Rainbow</title>
    <meta name="description" content="Turn over the cards two at a time to find every pair of rainbow colors. A free memory game for kids." />
    <link rel="canonical" href="https://jessicasogge.github.io/build-a-rainbow/memory-rainbow.html" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="page level-page">
    <level-header number="3" name="Memory rainbow" counter="0 of 6 pairs"></level-header>

    <main class="build">
      <helper-bubble>Turn over two cards to find a matching pair.</helper-bubble>

      <!-- Twelve cards, two of each color, face down. Added by
           memory-rainbow-page.js, which turns them over as they're tapped. -->
      <div class="memory-grid"></div>

      <!-- Takes the cards' place once every pair is found. -->
      <rainbow-stripes svg-class="memory-rainbow" hidden></rainbow-stripes>

      <level-done heading="You found every pair!">
        Fun fact: sometimes there's a second, fainter rainbow above the first, with its colors in the opposite order.
      </level-done>
    </main>

    <footer class="signature">jsogge 2026</footer>

    <script type="module">
      import { start } from './game/memory-rainbow-page.js';
      start();
    </script>
  </body>
</html>
