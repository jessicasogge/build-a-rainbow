<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Rainbow: Build a Rainbow</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="page level-page">
    <level-header number="3" name="Memory rainbow"></level-header>

    <main class="build">
      <!-- First the whole rainbow shows, to remember. After Ready, the stripes
           empty and color-order-page.js fills them back in as they're picked,
           with no outline showing which one is next. -->
      <rainbow-stripes svg-class="build-rainbow" stripe-class="build-stripe" blank></rainbow-stripes>

      <helper-bubble>Look at the rainbow! Tap Ready when you remember it.</helper-bubble>

      <button type="button" class="button button-play" id="ready">Ready!</button>

      <!-- The color buttons, in a shuffled order. Added by color-order-page.js. -->
      <div class="tray"></div>

      <level-done heading="You remembered the whole rainbow!">
        Fun fact: sometimes there's a second, fainter rainbow above the first, with its colors in the opposite order.
      </level-done>
    </main>

    <footer class="signature">jsogge 2026</footer>

    <script type="module">
      import { start } from './game/color-order-page.js';
      start(document, { memory: true });
    </script>
  </body>
</html>
