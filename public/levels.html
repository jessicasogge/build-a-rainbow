<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pick a Level: Build a Rainbow</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="page">
    <header class="page-header">
      <a class="round-button" href="./index.html" aria-label="Back to the title screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </a>
      <h1 class="page-title">Pick a level</h1>
    </header>

    <!-- The levels aren't built yet, so these don't go anywhere. Stars are
         all empty until the game saves progress. -->
    <main class="level-grid">
      <button type="button" class="level-card" data-level="1">
        <span class="level-top">
          <span class="level-number" style="--level-color: #d62f32">1</span>
          <span class="level-name">Color order</span>
        </span>
        <span class="level-hint">Stack the stripes, red on top.</span>
        <span class="stars" aria-label="No stars yet">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z" /></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z" /></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z" /></svg>
        </span>
      </button>

      <button type="button" class="level-card" data-level="2">
        <span class="level-top">
          <span class="level-number" style="--level-color: #c25e00">2</span>
          <span class="level-name">Mix a color</span>
        </span>
        <span class="level-hint">Red and yellow make…?</span>
        <span class="stars" aria-label="No stars yet">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z" /></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z" /></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z" /></svg>
        </span>
      </button>

      <button type="button" class="level-card" data-level="3" disabled>
        <span class="level-top">
          <span class="level-number level-locked">
            <svg viewBox="0 0 24 24" aria-label="Locked"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
          </span>
          <span class="level-name">Memory rainbow</span>
        </span>
        <span class="level-hint">Build it with no hints.</span>
        <span class="level-unlock">Finish level 2 to unlock</span>
      </button>

      <button type="button" class="level-card" data-level="4" disabled>
        <span class="level-top">
          <span class="level-number level-locked">
            <svg viewBox="0 0 24 24" aria-label="Locked"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
          </span>
          <span class="level-name">Sun and rain</span>
        </span>
        <span class="level-hint">Make the weather for a rainbow.</span>
        <span class="level-unlock">Finish level 3 to unlock</span>
      </button>
    </main>

    <footer class="signature">jsogge 2026</footer>
  </body>
</html>
