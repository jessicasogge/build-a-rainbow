<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Build a Rainbow</title>
    <meta name="description" content="A browser game for kids: put the colors in order and build a rainbow, one stripe at a time." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./game/components.js"></script>
  </head>
  <body>
    <!-- Sky decorations: the sun peeking in from the corner and two clouds -->
    <div class="sun" aria-hidden="true"></div>
    <div class="cloud cloud-left" aria-hidden="true"></div>
    <div class="cloud cloud-right" aria-hidden="true"></div>

    <main class="title-screen">
      <!-- Six stripes, red on the outside to purple on the inside. Indigo is
           left out, the usual simplification for young kids. -->
      <rainbow-stripes svg-class="rainbow" label="A rainbow"></rainbow-stripes>

      <h1 class="logo">Build a Rainbow</h1>
      <p class="tagline">Put the colors in order, one stripe at a time.</p>

      <!-- Play opens the level picker. -->
      <div class="buttons">
        <a class="button button-play" id="play" href="./levels.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" /></svg>
          Play
        </a>
      </div>
    </main>

    <footer class="signature">jsogge 2026</footer>
  </body>
</html>
