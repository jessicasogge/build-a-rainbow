<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Build a Rainbow: Color Games for Kids</title>
    <meta name="description" content="A browser game for kids with eight rainbow levels: mix colors, build and paint rainbows, drive a rainbow road and more." />
    <link rel="canonical" href="https://jessicasogge.github.io/build-a-rainbow/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./game/components.js"></script>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jessicasogge.github.io/build-a-rainbow/" />
    <meta property="og:title" content="Build a Rainbow" />
    <meta property="og:description" content="Mix, build and play with rainbow colors! Eight levels for young kids." />
    <meta property="og:image" content="https://jessicasogge.github.io/build-a-rainbow/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A big rainbow in a blue sky above the words Build a Rainbow" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div class="sun" aria-hidden="true"></div>
    <div class="cloud cloud-left" aria-hidden="true"></div>
    <div class="cloud cloud-right" aria-hidden="true"></div>

    <main class="title-screen">

      <rainbow-stripes svg-class="rainbow" label="A rainbow"></rainbow-stripes>

      <h1 class="logo">Build a Rainbow</h1>
      <p class="tagline">Mix, build and play with rainbow colors!</p>

      <!-- Play opens the level picker. -->
      <div class="buttons">
        <a class="button button-play" id="play" href="./levels.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" /></svg>
          Play
        </a>
      </div>
    </main>

    <footer class="signature">jsogge 2026</footer>
    <script data-goatcounter="https://petripals.goatcounter.com/count"
      async src="https://gc.zgo.at/count.js">
    </script>
  </body>
</html>
