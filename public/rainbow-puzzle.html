<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rainbow Puzzle: Build a Rainbow</title>
    <meta name="description" content="Put the pieces back together! Rainbow jigsaw puzzles of 6, 9 and 12 pieces, with a faint picture to follow. A free puzzle game for kids." />
    <link rel="canonical" href="https://jessicasogge.github.io/build-a-rainbow/rainbow-puzzle.html" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Rainbow" />
    <meta name="theme-color" content="#bfe6ff" />
    <link rel="preload" href="./fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/nunito-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="page level-page">
    <level-header number="16" name="Rainbow puzzle" counter="Puzzle 1 of 3"></level-header>

    <main class="build">
      <helper-bubble>Put the pieces back in the picture!</helper-bubble>

      <!-- The picture, faint, with a spot for each piece on top. Drawn by
           rainbow-puzzle-page.js. -->
      <div class="puzzle-board" role="group"></div>

      <!-- The pieces left, mixed up. Tap one and then its spot, or drag it. -->
      <div class="puzzle-tray"></div>

      <button type="button" class="button button-play" id="next" hidden>
        Next
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" /></svg>
      </button>

      <level-done heading="You finished every puzzle!" next="All levels">
        Fun fact: the first jigsaw puzzles were made about 260 years ago. They were maps, cut up so children could learn where each country goes!
      </level-done>
    </main>

    <footer class="signature">jsogge 2026</footer>

    <script type="module">
      import { start } from './game/rainbow-puzzle-page.js';
      start();
    </script>
    <script data-goatcounter="https://petripals.goatcounter.com/count"
      async src="https://gc.zgo.at/count.js">
    </script>
  </body>
</html>
