<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Word Scramble: Build a Rainbow</title>
    <meta name="description" content="Put the scrambled letters of RAINBOW back in order. A free spelling game for kids." />
    <link rel="canonical" href="https://jessicasogge.github.io/build-a-rainbow/word-scramble.html" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="page level-page">
    <level-header number="7" name="Word scramble"></level-header>

    <main class="build">
      <!-- A picture of the word, as a clue. -->
      <rainbow-stripes svg-class="scramble-rainbow" viewbox="0 0 320 162" cx="160" base="160" outer="150" inner="18"></rainbow-stripes>

      <!-- Seven boxes for the letters. word-scramble-page.js fills them in
           as the right letters are tapped. -->
      <div class="letter-boxes" role="img" aria-label="0 of 7 letters in place">
        <span class="letter-box"></span>
        <span class="letter-box"></span>
        <span class="letter-box"></span>
        <span class="letter-box"></span>
        <span class="letter-box"></span>
        <span class="letter-box"></span>
        <span class="letter-box"></span>
      </div>

      <helper-bubble>Put the letters in order to spell RAINBOW.</helper-bubble>

      <!-- The scrambled letters. Added by word-scramble-page.js. -->
      <div class="letter-tray"></div>

      <level-done heading="You spelled RAINBOW!">
        Fun fact: rainbow is two words stuck together, rain and bow. A bow is a curved shape, just like a rainbow.
      </level-done>
    </main>

    <footer class="signature">jsogge 2026</footer>

    <script type="module">
      import { start } from './game/word-scramble-page.js';
      start();
    </script>
  </body>
</html>
