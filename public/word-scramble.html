<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Word Scramble: Build a Rainbow</title>
    <meta name="description" content="Put the scrambled letters of RAINBOW, then SUNSHINE, back in order. A free spelling game for kids." />
    <link rel="canonical" href="https://jessicasogge.github.io/build-a-rainbow/word-scramble.html" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="page level-page">
    <level-header number="7" name="Word scramble" counter="Word 1 of 2"></level-header>

    <main class="build">
      <!-- A picture of the word, as a clue: a rainbow for RAINBOW and a sun
           for SUNSHINE. word-scramble-page.js shows the one for the word. -->
      <span data-clue="rainbow" class="scramble-clue">
        <rainbow-stripes svg-class="scramble-rainbow" viewbox="0 0 320 162" cx="160" base="160" outer="150" inner="18"></rainbow-stripes>
      </span>
      <svg data-clue="sun" class="scramble-sun" viewBox="0 0 320 162" aria-hidden="true" hidden>
        <g class="scramble-sun-rays">
          <path d="M160 6v22M160 134v22M86 81h22M212 81h22M108 29l15 15M197 118l15 15M212 29l-15 15M123 118l-15 15" />
        </g>
        <circle class="scramble-sun-face" cx="160" cy="81" r="44" />
      </svg>

      <!-- A box for each letter of the word. word-scramble-page.js makes
           them and fills them in as the right letters are tapped. -->
      <div class="letter-boxes" role="img" aria-label="0 of 7 letters in place"></div>

      <helper-bubble>Put the letters in order to spell RAINBOW.</helper-bubble>

      <!-- The scrambled letters. Added by word-scramble-page.js. -->
      <div class="letter-tray"></div>

      <button type="button" class="button button-play" id="next" hidden>
        Next
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" /></svg>
      </button>

      <level-done heading="You spelled RAINBOW and SUNSHINE!">
        Fun fact: both words are made of two smaller words, rain + bow and sun + shine. And it takes sunshine and rain at the same time to make a rainbow!
      </level-done>
    </main>

    <footer class="signature">jsogge 2026</footer>

    <script type="module">
      import { start } from './game/word-scramble-page.js';
      start();
    </script>
  </body>
</html>
